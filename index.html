<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>重力跃迁 Gravity Leap</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 800px at 50% -10%, #1d2436 0%, #0b0d14 70%);
    color: #e6e9f0;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 12px 40px;
  }
  h1 {
    font-size: 22px;
    letter-spacing: 4px;
    margin: 4px 0 2px;
    background: linear-gradient(90deg, #ff6b5b, #5bff9d, #5ba8ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 800;
  }
  .sub { font-size: 12px; color: #7a839b; letter-spacing: 1px; margin-bottom: 14px; }

  #board {
    display: grid;
    grid-template-columns: repeat(4, 128px);
    grid-template-rows: repeat(3, 128px);
    gap: 8px;
  }
  @media (max-width: 620px) {
    #board { grid-template-columns: repeat(4, 76px); grid-template-rows: repeat(3, 76px); gap: 5px; }
  }

  .face {
    background: #151a26;
    border: 1px solid #262f45;
    border-radius: 12px;
    padding: 6px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 3px;
    position: relative;
    box-shadow: 0 6px 18px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.02);
  }
  .face .tag {
    position: absolute;
    top: -9px; left: 8px;
    font-size: 10px;
    padding: 0 5px;
    background: #0b0d14;
    color: #6f7b99;
    border-radius: 4px;
    letter-spacing: 1px;
    border: 1px solid #262f45;
  }

  .cell {
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
    transition: transform .12s, box-shadow .12s, background .12s;
    user-select: none;
    position: relative;
    border: 1px solid transparent;
  }
  @media (max-width: 620px) { .cell { font-size: 12px; border-radius: 5px; } }

  .color-R { background: linear-gradient(150deg,#8a2f26,#4d1712); border-color:#e0503f; color:#ffd7d0; }
  .color-G { background: linear-gradient(150deg,#1d6b41,#0e3521); border-color:#31c977; color:#ccffe2; }
  .color-B { background: linear-gradient(150deg,#20548c,#0e2745); border-color:#3d9ae6; color:#cfe8ff; }

  .cell.visited { opacity: .95; }
  .cell.visited::after { content:''; position:absolute; inset:0; border-radius:inherit; background: rgba(0,0,0,.28); }
  .cell.visited { color:#fff; text-shadow: 0 0 8px rgba(255,255,255,.8); }
  .cell.visited > * { position: relative; z-index: 2; }

  .cell.reachable {
    box-shadow: 0 0 0 2px #ffd166, 0 0 14px rgba(255,209,102,.55);
    animation: pulse 1.2s infinite ease-in-out;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 2px #ffd166, 0 0 10px rgba(255,209,102,.35); }
    50%     { box-shadow: 0 0 0 2px #ffe9a8, 0 0 18px rgba(255,209,102,.85); }
  }

  .cell.current {
    box-shadow: 0 0 0 3px #ffffff, 0 0 22px rgba(255,255,255,.85);
    z-index: 3;
    transform: scale(1.04);
  }
  .cell.current.can-trigger {
    animation: curPulse 1s infinite ease-in-out;
  }
  @keyframes curPulse {
    0%,100% { box-shadow: 0 0 0 3px #fff, 0 0 16px rgba(255,255,255,.7); }
    50%     { box-shadow: 0 0 0 3px #fff, 0 0 30px rgba(140,200,255,1); }
  }
  .cell.current::before {
    content: '●';
    position: absolute;
    top: 1px; left: 3px;
    font-size: 8px;
    color: #fff;
    z-index: 4;
  }

  /* ===== 面板 ===== */
  #panel {
    margin-top: 18px;
    width: min(560px, 96vw);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .card {
    background: #151a26;
    border: 1px solid #262f45;
    border-radius: 12px;
    padding: 10px 12px;
  }
  .card h3 {
    margin: 0 0 8px;
    font-size: 11px;
    letter-spacing: 2px;
    color: #6f7b99;
    font-weight: 700;
  }
  .sw {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    padding: 5px 0;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
  .dot.R { background:#e0503f; box-shadow:0 0 10px #e0503f; }
  .dot.G { background:#31c977; box-shadow:0 0 10px #31c977; }
  .dot.B { background:#3d9ae6; box-shadow:0 0 10px #3d9ae6; }
  .sw .val { margin-left: auto; font-weight: 800; letter-spacing: 1px; }
  .sw.active { color: #ffe9a8; }

  #gravityBox {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .gdir {
    font-size: 34px;
    font-weight: 900;
    line-height: 1;
    color: #8ec5ff;
    text-shadow: 0 0 18px rgba(90,170,255,.8);
    min-width: 46px;
    text-align: center;
  }
  .gtext { font-size: 13px; color: #9aa5bf; }
  .gtext b { color: #fff; font-size: 15px; }

  #progBarWrap {
    grid-column: 1 / -1;
    height: 8px;
    background: #0d111a;
    border-radius: 99px;
    overflow: hidden;
    border: 1px solid #262f45;
  }
  #progBar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff6b5b, #ffd166, #5bff9d);
    transition: width .25s;
  }

  /* ===== 按钮区 ===== */
  #btns {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  button {
    padding: 10px 8px;
    border-radius: 10px;
    border: 1px solid #34405c;
    background: #1c2333;
    color: #d7deee;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  button:hover { background: #263149; border-color: #4a5c85; color: #fff; }
  button:active { transform: scale(.97); }
  button.primary { background: linear-gradient(135deg,#2b5cb8,#1b3a75); border-color:#3f74d6; }
  button.primary:hover { background: linear-gradient(135deg,#3a72d6,#234a92); }
  button.lamp { background: linear-gradient(135deg,#8a6a12,#5c4708); border-color:#e0b93f; color:#ffe9a8; }
  button.lamp:hover { background: linear-gradient(135deg,#b08a1a,#6e560c); border-color:#ffd766; }
  button.undo { background: #232a3d; border-color: #4a5c85; }

  #toast {
    position: fixed;
    left: 50%;
    top: 26px;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(20,26,38,.96);
    border: 1px solid #3a4a6d;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: all .3s;
    z-index: 99;
    box-shadow: 0 8px 30px rgba(0,0,0,.6);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .hint { font-size: 11px; color: #6f7b99; line-height: 1.7; }
  .hint b { color: #9aa5bf; }
</style>
</head>
<body>

<h1>重 力 跃 迁</h1>
<div class="sub">GRAVITY LEAP · 3×3×3 立方体 54 格</div>

<div id="board"></div>

<div id="panel">
  <div class="card">
    <h3>开关状态</h3>
    <div class="sw" id="swR"><span class="dot R"></span>红色 · 上下<span class="val">↓ 下</span></div>
    <div class="sw" id="swG"><span class="dot G"></span>绿色 · 左右<span class="val">→ 右</span></div>
    <div class="sw" id="swB"><span class="dot B"></span>蓝色 · 前后<span class="val">⊗ 后</span></div>
  </div>

  <div class="card">
    <h3>玩法</h3>
    <div class="hint">
      <b>点击相邻格</b>移动 · <b>点击当前格</b>触发开关<br>
      触发后小球会沿新重力方向坠落到对应面<br>
      💡 灯泡：每点一次走一步答案 · ↶ 撤回上一步
    </div>
  </div>

  <div class="card" id="gravityBox">
    <div class="gdir" id="gdir">↓</div>
    <div class="gtext">
      当前重力方向：<b id="gtext">下</b><br>
      <span style="color:#6f7b99">已通过格子：<b id="scoreText" style="color:#ffe9a8">1</b> / 54</span>
    </div>
  </div>

  <div id="progBarWrap"><div id="progBar"></div></div>

  <div id="btns">
    <button id="btnUndo" class="undo">↶ 撤回</button>
    <button id="btnDemo" class="lamp">💡 演示答案</button>
    <button id="btnRestart">重来本局</button>
    <button id="btnNew" class="primary">生成新题</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* =========================================================
   1. 立方体几何模型
   ========================================================= */
const FACE_DEF = {
  R: { axis: 0, val: 2, dir: '+x' },
  L: { axis: 0, val: 0, dir: '-x' },
  U: { axis: 1, val: 2, dir: '+y' },
  D: { axis: 1, val: 0, dir: '-y' },
  F: { axis: 2, val: 2, dir: '+z' },
  B: { axis: 2, val: 0, dir: '-z' },
};
const FACES = ['U', 'D', 'L', 'R', 'F', 'B'];

const DIR_DEF = {
  '+x': { axis: 0, val: 2, face: 'R' },
  '-x': { axis: 0, val: 0, face: 'L' },
  '+y': { axis: 1, val: 2, face: 'U' },
  '-y': { axis: 1, val: 0, face: 'D' },
  '+z': { axis: 2, val: 2, face: 'F' },
  '-z': { axis: 2, val: 0, face: 'B' },
};

const TILES = [];
const TILE_INDEX = new Map();
for (const f of FACES) {
  const d = FACE_DEF[f];
  const free = [0, 1, 2].filter(a => a !== d.axis);
  for (let i = 0; i < 3; i++) {
    for (let j = 0; j < 3; j++) {
      const c = [0, 0, 0];
      c[d.axis] = d.val;
      c[free[0]] = i;
      c[free[1]] = j;
      const t = { id: f + i + j, face: f, x: c[0], y: c[1], z: c[2] };
      TILES.push(t);
      TILE_INDEX.set(f + ':' + c[0] + ',' + c[1] + ',' + c[2], t);
    }
  }
}
const TILE_MAP = {};
for (const t of TILES) TILE_MAP[t.id] = t;

function tileAt(face, x, y, z) {
  return TILE_INDEX.get(face + ':' + x + ',' + y + ',' + z);
}

function neighborsOf(t) {
  const res = [];
  const d = FACE_DEF[t.face];
  const free = [0, 1, 2].filter(a => a !== d.axis);
  const coords = [t.x, t.y, t.z];
  for (const a of free) {
    for (const delta of [-1, 1]) {
      const c = coords.slice();
      c[a] += delta;
      if (c[a] < 0 || c[a] > 2) continue;
      const nt = tileAt(t.face, c[0], c[1], c[2]);
      if (nt) res.push(nt);
    }
  }
  return res;
}

function project(t, dirKey) {
  const d = DIR_DEF[dirKey];
  const c = [t.x, t.y, t.z];
  c[d.axis] = d.val;
  return tileAt(d.face, c[0], c[1], c[2]);
}

function flipDir(color, cur) {
  if (color === 'R') return cur === '-y' ? '+y' : '-y';
  if (color === 'G') return cur === '+x' ? '-x' : '+x';
  return cur === '-z' ? '+z' : '-z';
}

/* =========================================================
   2. 题面生成器（回溯搜索 1~54 完整路径）
   ========================================================= */
function attemptBuild(nodeLimit) {
  let nodes = 0;
  let aborted = false;
  const visited = new Set();
  const path = []; // { tile, trigger }  trigger: 从该格触发去往下一格

  const downTiles = TILES.filter(t => t.face === 'D');
  const start = downTiles[(Math.random() * downTiles.length) | 0];

  function deg(t) {
    let d = 0;
    for (const nb of neighborsOf(t)) if (!visited.has(nb.id)) d++;
    return d;
  }

  function dfs(tile, red, green, blue) {
    if (++nodes > nodeLimit) { aborted = true; return false; }
    visited.add(tile.id);
    path.push({ tile, trigger: null });

    if (path.length === 54) return true;

    const cands = [];

    for (const nb of neighborsOf(tile)) {
      if (!visited.has(nb.id)) {
        cands.push({ target: nb, trigger: null, newDir: null, score: deg(nb) + Math.random() * 0.85 });
      }
    }

    const opts = [
      { color: 'R', newDir: red === '-y' ? '+y' : '-y' },
      { color: 'G', newDir: green === '+x' ? '-x' : '+x' },
      { color: 'B', newDir: blue === '-z' ? '+z' : '-z' },
    ];
    for (const o of opts) {
      const tgt = project(tile, o.newDir);
      if (!tgt || tgt.id === tile.id) continue;
      if (visited.has(tgt.id)) continue;
      cands.push({ target: tgt, trigger: o.color, newDir: o.newDir, score: deg(tgt) + Math.random() * 0.85 });
    }

    cands.sort((a, b) => a.score - b.score);

    for (const c of cands) {
      if (c.trigger) {
        let nr = red, ng = green, nb2 = blue;
        if (c.trigger === 'R') nr = c.newDir;
        else if (c.trigger === 'G') ng = c.newDir;
        else nb2 = c.newDir;
        path[path.length - 1].trigger = c.trigger;
        if (dfs(c.target, nr, ng, nb2)) return true;
        path[path.length - 1].trigger = null;
      } else {
        if (dfs(c.target, red, green, blue)) return true;
      }
      if (aborted) return false;
    }

    visited.delete(tile.id);
    path.pop();
    return false;
  }

  if (dfs(start, '-y', '+x', '-z')) return { path };
  return null;
}

function generatePuzzle() {
  const t0 = Date.now();
  while (Date.now() - t0 < 4500) {
    const res = attemptBuild(90000);
    if (res) {
      const colors = {};
      for (const p of res.path) if (p.trigger) colors[p.tile.id] = p.trigger;
      const pool = ['R', 'G', 'B'];
      for (const t of TILES) {
        if (!colors[t.id]) colors[t.id] = pool[(Math.random() * 3) | 0];
      }
      return {
        colors,
        start: res.path[0].tile.id,
        solution: res.path.map(p => p.tile.id),
        triggers: res.path.map(p => p.trigger), // triggers[i] 从 solution[i] 触发到 solution[i+1]
      };
    }
  }
  return null;
}

/* =========================================================
   3. 界面构建
   ========================================================= */
const NET_POS = {
  U: { r: 0, c: 1 }, L: { r: 1, c: 0 }, F: { r: 1, c: 1 },
  R: { r: 1, c: 2 }, B: { r: 1, c: 3 }, D: { r: 2, c: 1 },
};
const FACE_NAME = { U: '上', D: '下', L: '左', R: '右', F: '前', B: '后' };

const COORD_MAP = {
  R: (r, c) => [2, 2 - r, 2 - c],
  L: (r, c) => [0, 2 - r, c],
  U: (r, c) => [c, 2, r],
  D: (r, c) => [c, 0, 2 - r],
  F: (r, c) => [c, 2 - r, 2],
  B: (r, c) => [2 - c, 2 - r, 0],
};

const FACE_GRID = {};
const TILE_EL = {};

const boardEl = document.getElementById('board');
for (const f of ['U', 'L', 'F', 'R', 'B', 'D']) {
  const grid = [];
  const faceEl = document.createElement('div');
  faceEl.className = 'face';
  const p = NET_POS[f];
  faceEl.style.gridRow = (p.r + 1);
  faceEl.style.gridColumn = (p.c + 1);

  const tag = document.createElement('div');
  tag.className = 'tag';
  tag.textContent = FACE_NAME[f];
  faceEl.appendChild(tag);

  for (let r = 0; r < 3; r++) {
    grid.push([]);
    for (let c = 0; c < 3; c++) {
      const [x, y, z] = COORD_MAP[f](r, c);
      const t = tileAt(f, x, y, z);
      grid[r].push(t);

      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.id = t.id;
      cell.addEventListener('click', () => handleClick(t.id));
      faceEl.appendChild(cell);
      TILE_EL[t.id] = cell;
    }
  }
  FACE_GRID[f] = grid;
  boardEl.appendChild(faceEl);
}

/* =========================================================
   4. 游戏状态与逻辑
   ========================================================= */
let game = null;
let puzzle = null;

const DIR_TEXT = {
  '-y': ['↓', '下'], '+y': ['↑', '上'],
  '+x': ['→', '右'], '-x': ['←', '左'],
  '+z': ['⊙', '前'], '-z': ['⊗', '后'],
};

function newGame() {
  toast('正在生成题面…');
  setTimeout(() => {
    const p = generatePuzzle();
    if (!p) { toast('生成失败，请再试一次'); return; }
    puzzle = p;
    startFromPuzzle();
    toast('题目已生成 · 起点为数字 1');
  }, 30);
}

function startFromPuzzle() {
  game = {
    colors: puzzle.colors,
    current: puzzle.start,
    order: {},
    switches: { R: '-y', G: '+x', B: '-z' },
    gravity: '-y',
    step: 1,
    over: false,
    reachable: new Set(),
    canTrigger: false,
    history: [],
  };
  game.order[puzzle.start] = 1;
  updateReachable();
  render();
}

function pushHistory() {
  if (!game) return;
  game.history.push({
    current: game.current,
    order: Object.assign({}, game.order),
    switches: Object.assign({}, game.switches),
    gravity: game.gravity,
    step: game.step,
    over: game.over,
  });
}

function updateReachable() {
  const cur = TILE_MAP[game.current];
  game.reachable = new Set();
  for (const nb of neighborsOf(cur)) {
    if (!game.order[nb.id]) game.reachable.add(nb.id);
  }
  const color = game.colors[game.current];
  const nd = flipDir(color, game.switches[color]);
  const tgt = project(cur, nd);
  game.canTrigger = !!(tgt && tgt.id !== cur.id && !game.order[tgt.id]);
}

function handleClick(id) {
  if (!game || game.over) return;
  if (id === game.current) {
    if (game.canTrigger) doTrigger();
    else toast('此方向已被占据，无法触发');
    return;
  }
  if (game.reachable.has(id)) doMove(id);
}

function doMove(id) {
  pushHistory();
  game.current = id;
  game.order[id] = ++game.step;
  updateReachable();
  render();
  checkOver();
}

function doTrigger() {
  const color = game.colors[game.current];
  const nd = flipDir(color, game.switches[color]);
  const tgt = project(TILE_MAP[game.current], nd);
  if (!tgt || game.order[tgt.id]) { toast('无法触发'); return; }
  pushHistory();
  game.switches[color] = nd;
  game.gravity = nd;
  game.current = tgt.id;
  game.order[tgt.id] = ++game.step;
  updateReachable();
  render();
  checkOver();
}

function checkOver() {
  if (game.step >= 54) {
    game.over = true;
    render();
    toast('🎉 完美通关！54 格全部走完！');
    return;
  }
  if (game.reachable.size === 0 && !game.canTrigger) {
    game.over = true;
    render();
    toast('无路可走了 · 共通过 ' + game.step + ' 格');
  }
}

/* =========================================================
   5. 撤回
   ========================================================= */
function undo() {
  if (!game) return;
  if (!game.history.length) { toast('没有可撤回的操作'); return; }
  const s = game.history.pop();
  game.current = s.current;
  game.order = s.order;
  game.switches = s.switches;
  game.gravity = s.gravity;
  game.step = s.step;
  game.over = s.over;
  updateReachable();
  render();
  toast('已撤回一步');
}

/* =========================================================
   6. 演示答案（灯泡）
   ========================================================= */
function simulateSwitches(n) {
  // n = 已走过的格子数
  const sw = { R: '-y', G: '+x', B: '-z' };
  for (let i = 0; i < n - 1; i++) {
    const trg = puzzle.triggers[i];
    if (trg) sw[trg] = flipDir(trg, sw[trg]);
  }
  return sw;
}

function inSyncWithSolution() {
  if (!puzzle || !game) return false;
  const n = game.step;
  if (n < 1 || n > puzzle.solution.length) return false;
  if (game.current !== puzzle.solution[n - 1]) return false;
  const exp = simulateSwitches(n);
  return exp.R === game.switches.R && exp.G === game.switches.G && exp.B === game.switches.B;
}

function doDemoStep() {
  if (!game || !puzzle) return;

  if (game.step >= 54) { toast('已经走完全部 54 格啦'); return; }

  if (!inSyncWithSolution()) {
    startFromPuzzle();
    toast('💡 从起点开始演示');
  }

  const i = game.step - 1;              // 当前格子对应 solution 下标
  if (i >= puzzle.solution.length - 1) { toast('已到最后一步'); return; }

  const toId = puzzle.solution[i + 1];
  const trg = puzzle.triggers[i];

  if (trg) {
    const nd = flipDir(trg, game.switches[trg]);
    pushHistory();
    game.switches[trg] = nd;
    game.gravity = nd;
    game.current = toId;
    game.order[toId] = ++game.step;
  } else {
    pushHistory();
    game.current = toId;
    game.order[toId] = ++game.step;
  }

  updateReachable();
  render();
  checkOver();

  if (game.step >= 54) toast('🎉 演示完成！');
}

/* =========================================================
   7. 渲染
   ========================================================= */
function render() {
  if (!game) return;

  for (const f of FACES) {
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        const t = FACE_GRID[f][r][c];
        const el = TILE_EL[t.id];
        el.className = 'cell color-' + game.colors[t.id];
        const ord = game.order[t.id];
        el.textContent = ord ? ord : '';
        if (ord) el.classList.add('visited');
        if (game.reachable.has(t.id)) el.classList.add('reachable');
        if (t.id === game.current) {
          el.classList.add('current');
          if (game.canTrigger && !game.over) el.classList.add('can-trigger');
        }
      }
    }
  }

  const swR = document.getElementById('swR');
  const swG = document.getElementById('swG');
  const swB = document.getElementById('swB');
  const curColor = game.colors[game.current];
  swR.querySelector('.val').textContent = DIR_TEXT[game.switches.R][0] + ' ' + DIR_TEXT[game.switches.R][1];
  swG.querySelector('.val').textContent = DIR_TEXT[game.switches.G][0] + ' ' + DIR_TEXT[game.switches.G][1];
  swB.querySelector('.val').textContent = DIR_TEXT[game.switches.B][0] + ' ' + DIR_TEXT[game.switches.B][1];
  swR.classList.toggle('active', curColor === 'R' && !game.over);
  swG.classList.toggle('active', curColor === 'G' && !game.over);
  swB.classList.toggle('active', curColor === 'B' && !game.over);

  const gd = DIR_TEXT[game.gravity];
  document.getElementById('gdir').textContent = gd[0];
  document.getElementById('gtext').textContent = gd[1];

  document.getElementById('scoreText').textContent = game.step;
  document.getElementById('progBar').style.width = (game.step / 54 * 100) + '%';

  document.getElementById('btnUndo').disabled = (game.history.length === 0);
  document.getElementById('btnUndo').style.opacity = game.history.length === 0 ? .45 : 1;
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

/* =========================================================
   8. 按钮
   ========================================================= */
document.getElementById('btnRestart').addEventListener('click', () => {
  if (puzzle) { startFromPuzzle(); toast('已重置本局'); }
});
document.getElementById('btnNew').addEventListener('click', newGame);
document.getElementById('btnUndo').addEventListener('click', undo);
document.getElementById('btnDemo').addEventListener('click', doDemoStep);

/* 启动 */
newGame();
</script>
